version: 2

models:
  - name: fct_sessions_daily
    description: "One row per calendar day. Session volume, engagement, and purchase conversion for stakeholder reporting."
    columns:
      - name: session_date
        description: "Calendar date the session started (UTC)."
        tests: [not_null, unique]
      - name: total_sessions
        description: "Count of distinct sessions on this date."
        tests: [not_null]
      - name: total_users
        description: "Count of distinct users active on this date."
        tests: [not_null]
      - name: avg_session_duration_seconds
        description: "Mean session duration across sessions on this date, in seconds."
        tests: [not_null]
      - name: avg_events_per_session
        description: "Mean number of events per session on this date."
        tests: [not_null]
      - name: sessions_with_purchase
        description: "Count of sessions on this date that included a purchase."
        tests: [not_null]
      - name: purchase_rate
        description: "Share of sessions on this date that included a purchase."
        tests: [not_null]

  - name: fct_user_retention
    description: >
      Day-1 retention by first-session cohort date. One row per cohort date.
      Cohorts whose day-1 window isn't fully observed yet (i.e. the most
      recent day(s) of data) are excluded — see fct_user_retention.sql.
    columns:
      - name: first_session_date
        description: "Date of a user's first session (cohort date)."
        tests: [not_null, unique]
      - name: cohort_size
        description: "Number of distinct users who first appeared on this date."
        tests: [not_null]
      - name: day_1_retention_rate
        description: >
          Share of the cohort that returned exactly one day later.
          Only calculated for cohorts with a fully observed day-1 window.
        tests: [not_null]

  - name: fct_funnel_purchase
    description: "Session-level purchase funnel: view_item to add_to_cart to purchase, for the full project date range."
    columns:
      - name: total_sessions
        description: "Total sessions in the dataset (one row per session/user in int_sessions)."
        tests: [not_null]
      - name: sessions_viewed_item
        description: "Sessions that included at least one view_item event."
        tests: [not_null]
      - name: sessions_added_to_cart
        description: "Sessions that viewed an item and also added to cart."
        tests: [not_null]
      - name: sessions_purchased
        description: "Sessions that viewed an item, added to cart, and completed a purchase."
        tests: [not_null]
      - name: view_to_cart_rate
        description: "Share of item-viewing sessions that also added to cart."
        tests: [not_null]
      - name: cart_to_purchase_rate
        description: "Share of add-to-cart sessions that completed a purchase."
        tests: [not_null]