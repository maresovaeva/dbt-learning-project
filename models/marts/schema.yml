version: 2

models:
  - name: fct_sessions_daily
    description: "One row per calendar day. Session volume, engagement, and purchase conversion for stakeholder reporting."
    columns:
      - name: session_date
        description: "Calendar date the session started (UTC)."
        tests: [not_null, unique]
      - name: total_sessions
        description: "Count of distinct sessions on this date."
        tests: [not_null]

  - name: fct_user_retention
    description: "Day-1 retention by first-session cohort date. One row per cohort date."
    columns:
      - name: first_session_date
        description: "Date of a user's first session (cohort date)."
        tests: [not_null, unique]
      - name: cohort_size
        description: "Number of distinct users who first appeared on this date."
        tests: [not_null]
      - name: day_1_retention_rate
        description: "Share of the cohort that returned exactly one day later."
        tests: [not_null]

  - name: fct_funnel_purchase
    description: "Session-level purchase funnel: view_item to add_to_cart to purchase, for the full project date range."
    columns:
      - name: total_sessions
        description: "Total distinct sessions in the dataset."
        tests: [not_null]
      - name: view_to_cart_rate
        description: "Share of item-viewing sessions that also added to cart."
        tests: [not_null]
      - name: cart_to_purchase_rate
        description: "Share of add-to-cart sessions that completed a purchase."
        tests: [not_null]